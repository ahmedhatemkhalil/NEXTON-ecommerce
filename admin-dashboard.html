<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - E-Commerce Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <img src="src/logo.png" alt="logo">
            </a>
            <div class="d-flex align-items-center gap-3">
                <span id="userInfo" class="text-white me-2"></span>
                <a href="index.html" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-house"></i> Home
                </a>
                <a href="#" class="btn btn-outline-danger btn-sm" id="logoutLink">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4"><i class="bi bi-speedometer2"></i> Admin Dashboard</h1>
                <div class="alert alert-info">
                    <i class="bi bi-info-circle"></i> This page is only accessible to Admin users.
                </div>

                <div class="row mt-4">
                    <div class="col-md-4 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title"><i class="bi bi-people"></i> Users</h5>
                                <p class="card-text">Manage user accounts and permissions</p>
                                <a href="#" class="btn btn-primary">Manage Users</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title"><i class="bi bi-box-seam"></i> Products</h5>
                                <p class="card-text">Add, edit, or remove products</p>
                                <a href="#" class="btn btn-primary">Manage Products</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title"><i class="bi bi-graph-up"></i> Analytics</h5>
                                <p class="card-text">View sales and performance metrics</p>
                                <a href="#" class="btn btn-primary">View Analytics</a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mt-4">
                    <div class="card-header">
                        <h5><i class="bi bi-list-ul"></i> All Registered Users</h5>
                    </div>
                    <div class="card-body">
                        <div id="usersList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="auth.js"></script>
    <script>
        // Protect this route - only admins can access
        if (!protectRoute('admin', './login.html')) {
            // Redirect will happen automatically
        }

        // Update user info
        const user = getCurrentUser();
        if (user) {
            const userInfo = document.getElementById('userInfo');
            if (userInfo) {
                userInfo.textContent = `Welcome, ${user.name} (${user.role})`;
            }
        }

        // Logout functionality
        const logoutLink = document.getElementById('logoutLink');
        if (logoutLink) {
            logoutLink.addEventListener('click', function(e) {
                e.preventDefault();
                // Logout user
                logoutUser();
                // Update navigation immediately
                updateNavigation();
                // Show success message
                showMessage('Logged out successfully', 'success');
                // Redirect to login page
                setTimeout(() => {
                    window.location.href = './login.html';
                }, 1000);
            });
        }

        // Display all users (admin feature)
        function displayUsers() {
            const users = getUsers();
            const usersList = document.getElementById('usersList');
            
            if (usersList && users.length > 0) {
                let html = '<table class="table table-striped"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Created</th></tr></thead><tbody>';
                users.forEach(user => {
                    html += `<tr>
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td><span class="badge bg-${user.role === 'admin' ? 'danger' : 'primary'}">${user.role}</span></td>
                        <td>${new Date(user.createdAt).toLocaleDateString()}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                usersList.innerHTML = html;
            } else {
                usersList.innerHTML = '<p class="text-muted">No users found.</p>';
            }
        }

        // Load users on page load
        displayUsers();
    </script>
</body>

</html>
