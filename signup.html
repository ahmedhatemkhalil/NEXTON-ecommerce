<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - E-Commerce Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">
    <div class="auth-container">
        <div class="auth-wrapper">
            <!-- Logo -->
            <div class="auth-logo mb-4">
                <a href="./index.html">
                    <img src="src/logo.png" alt="logo" class="auth-logo-img">
                </a>
            </div>

            <!-- Sign Up Form -->
            <div class="auth-form-container">
                <h1 class="auth-title mb-4">Sign Up</h1>

                <form class="auth-form">
                    <div class="mb-4">
                        <label for="fullName" class="auth-label">Full Name</label>
                        <input type="text" class="form-control auth-input" id="fullName" placeholder="John Doe">
                    </div>

                    <div class="mb-4">
                        <label for="email" class="auth-label">Email</label>
                        <input type="email" class="form-control auth-input" id="email" placeholder="example@example.com">
                    </div>

                    <div class="mb-4">
                        <label for="password" class="auth-label">Password</label>
                        <input type="password" class="form-control auth-input" id="password" placeholder="">
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="auth-label">Confirm Password</label>
                        <input type="password" class="form-control auth-input" id="confirmPassword" placeholder="">
                    </div>

                    <button type="submit" class="btn auth-btn w-100 mb-3">Continue</button>
                </form>

                <div class="auth-divider">
                    <span>OR</span>
                </div>

                <div class="auth-footer text-center mt-4">
                    <p class="auth-footer-text">
                        Already have an account? <a href="./login.html" class="auth-link">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
